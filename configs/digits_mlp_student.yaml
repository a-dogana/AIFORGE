experiment_name: "Student MLP (Distilled)"
domain: "vision"
task: "classification"
data:
  type: "digits_builtin"
architecture:
  type: "mlp"
  mlp_config:
    input_size: 64
    hidden_sizes: [16] # Much smaller than teacher
    output_size: 10
batch_size: 32
epochs: 50
learning_rate: 0.005
device: "auto"
seed: 42
early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  patience: 5
  min_epochs: 10
distillation:
  enabled: true
  teacher_experiment_id: "08d48b4c"
  temperature: 3.0
  alpha: 0.7
